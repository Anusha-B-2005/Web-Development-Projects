
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Game.png" type="image/png">
    <style>
        .home {
            position: absolute;
            top: 10px;
            left: 15px;
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <button class="home" onclick="window.location.href='Index.html';">Home</button>
    <div id="selection-container">
        <br><br><br><br><br><br>
        <h1>Tic Tac Toe!</h1>
        <h2>Select symbol for first move</h2>
        <button onclick="selectSymbol('X')">X</button>
        <button onclick="selectSymbol('O')">O</button>
    </div>
    
    <div id="game-container" style="display: none;">
        <br>
        <h1>Tic Tac Toe!</h1>
        <br>
        <h2 id="turn-status"></h2>
        <div class="board">
            <div class="cell" onclick="handleClick(0)"></div>
            <div class="cell" onclick="handleClick(1)"></div>
            <div class="cell" onclick="handleClick(2)"></div>
            <div class="cell" onclick="handleClick(3)"></div>
            <div class="cell" onclick="handleClick(4)"></div>
            <div class="cell" onclick="handleClick(5)"></div>
            <div class="cell" onclick="handleClick(6)"></div>
            <div class="cell" onclick="handleClick(7)"></div>
            <div class="cell" onclick="handleClick(8)"></div>
        </div>
        <h2 id="status"></h2>
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer;
        let gameActive = false;
        const statusDisplay = document.getElementById("status");
        const turnStatus = document.getElementById("turn-status");
        const gameContainer = document.getElementById("game-container");
        const selectionContainer = document.getElementById("selection-container");

        function selectSymbol(symbol) {
            currentPlayer = symbol;
            gameActive = true;
            selectionContainer.style.display = "none";
            gameContainer.style.display = "block";
            turnStatus.innerText = `Player ${currentPlayer}'s Turn`;
            updateBoard();
        }

        function handleClick(index) {
            if (board[index] === "" && gameActive) {
                board[index] = currentPlayer;
                updateBoard();
                if (checkWinner()) return;
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                turnStatus.innerText = `Player ${currentPlayer}'s Turn`;
            }
        }

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            for (let combo of winningCombinations) {
                let [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameActive = false;
                    statusDisplay.innerText = `Player-'${board[a]}' Won the Game!`;
                    turnStatus.innerText = "";
                    return true;
                }
            }
            if (!board.includes("")) {
                gameActive = false;
                statusDisplay.innerText = "It's a Draw!";
                turnStatus.innerText = "";
                return true;
            }
            return false;
        }

        function updateBoard() {
            document.querySelectorAll(".cell").forEach((cell, index) => {
                cell.innerText = board[index];
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            gameActive = false;
            selectionContainer.style.display = "block";
            gameContainer.style.display = "none";
            statusDisplay.innerText = "";
            turnStatus.innerText = "";
            document.querySelectorAll(".cell").forEach(cell => cell.innerText = "");
        }
    </script>
</body>
</html>
